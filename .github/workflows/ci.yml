name: CI – Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ────────────────────────────────────────────────
  frontend-build:
    name: React Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          # Use a dummy backend URL during CI so the build doesn't fail
          REACT_APP_BACKEND_URL: https://skill-gap-backend.up.railway.app
          CI: false   # prevents react-scripts from treating warnings as errors

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: frontend/build/

  # ── Backend ─────────────────────────────────────────────────
  backend-lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core deps only (fast lint check)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv flake8

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other warnings as non-blocking
          flake8 backend --count --exit-zero --max-line-length=120 --statistics
